# Creates any missing Cove Watchdog settings on the Function App.
#
# Designed to be called from the deployment workflow Azure generates, AFTER
# its azure/login step - it reuses that session, so it needs no secrets of its
# own and nothing to configure.
#
# Living here rather than inline in that workflow means the logic is version
# controlled upstream and reaches a fork by syncing. Only a two-line hook has
# to exist in the generated file.
#
# Usage, in the generated workflow's deploy job, after azure/login:
#
#     - name: Configure Cove Watchdog settings
#       uses: ./.github/actions/configure-settings
#       with:
#         app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
#         resource-group: Cove-Watchdog
#
# Only ADDS settings that do not already exist, so a value tuned in the portal
# is never reset, and a setting added to the project later appears on the next
# deploy.

name: Configure Cove Watchdog settings
description: >
  Create any missing Function App settings for the Cove backup watchdog.
  Never overwrites an existing value.

inputs:
  app-name:
    description: Function App name.
    required: true
  resource-group:
    description: Resource group holding the Function App.
    required: true
  fail-on-missing-required:
    description: >
      Fail the job when a required setting is still blank. Off by default:
      filling the Cove token and SMTP host is a job for a human in the portal,
      and a permanently red pipeline is one nobody reads.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Create missing settings
      shell: pwsh
      run: |
        $script = Join-Path "${{ github.workspace }}" "scripts/setup-app-settings.ps1"
        if (-not (Test-Path $script)) {
            Write-Output "::error::$script not found. Is the repository checked out?"
            exit 1
        }

        & $script -AppName "${{ inputs.app-name }}" -ResourceGroup "${{ inputs.resource-group }}"
        $code = $LASTEXITCODE

        # 2 means every setting now exists but a required one is still blank.
        if ($code -eq 2) {
            $msg = "Cove Watchdog settings created, but some required values are still blank. Fill them in the Azure portal; the watchdog will not run until you do."
            if ("${{ inputs.fail-on-missing-required }}" -eq "true") {
                Write-Output "::error::$msg"
                exit 1
            }
            Write-Output "::warning::$msg"
            exit 0
        }
        exit $code
